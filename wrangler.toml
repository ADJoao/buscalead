# Cloudflare Workers: build com `npm run build`, deploy com `npx wrangler deploy`.
# (No Cloudflare Pages este arquivo é ignorado e a pasta functions/ é usada.)
name = "buscalead"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true
